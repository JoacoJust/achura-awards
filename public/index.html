<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achura Awards 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --bg-card-hover: #23232f;
      --border: #2a2a3a;
      --border-light: #3a3a4a;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --accent: #f59e0b;
      --accent-light: #fbbf24;
      --accent-dark: #d97706;
      --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #f59e0b 100%);
      --success: #10b981;
      --error: #ef4444;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
      --shadow-accent: 0 4px 20px rgba(245, 158, 11, 0.3);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at top, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      padding: 60px 20px 40px;
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 2px;
      background: var(--accent-gradient);
      border-radius: 2px;
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }

    .logo-container::before {
      content: '';
      position: absolute;
      inset: -10px;
      background: var(--accent-gradient);
      border-radius: 30px;
      filter: blur(30px);
      opacity: 0.4;
      z-index: -1;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }

    header img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 28px;
      border: 3px solid var(--accent);
      box-shadow: var(--shadow-accent);
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    header img:hover {
      transform: scale(1.05) rotate(2deg);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin: 24px 0 12px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(245, 158, 11, 0.3);
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .badge {
      display: inline-block;
      background: var(--accent-gradient);
      color: var(--bg-primary);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 16px;
      box-shadow: var(--shadow-accent);
    }

    /* Progress Bar */
    .progress-container {
      max-width: 600px;
      margin: 0 auto 32px;
      padding: 0 20px;
    }

    .progress-text {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .progress-bar {
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-gradient);
      border-radius: 10px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      margin: 0 auto 32px;
      max-width: 600px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .card h3 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .card p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .card strong {
      color: var(--accent);
    }

    /* Input */
    .input-group {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all 0.3s ease;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    /* Button */
    .btn {
      background: var(--accent-gradient);
      color: var(--bg-primary);
      border: none;
      padding: 16px 32px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-accent);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 2px solid var(--border);
      box-shadow: none;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.2);
    }

    .btn:disabled {
      background: var(--bg-secondary);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn:disabled::before {
      display: none;
    }

    /* Message */
    .msg {
      margin: 20px auto;
      max-width: 600px;
      padding: 20px 24px;
      border-radius: 14px;
      display: none;
      font-size: 1rem;
      font-weight: 500;
      border: 1px solid;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.success {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border-color: #10b981;
      display: block;
    }

    .msg.error {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border-color: #ef4444;
      display: block;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 32px;
    }

    /* Option Card */
    .op {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .op::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--accent-gradient);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .op:hover {
      border-color: var(--accent);
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
    }

    .op:hover::before {
      transform: scaleX(1);
    }

    .op img, .op video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
      transition: transform 0.3s ease;
    }

    .op:hover img, .op:hover video {
      transform: scale(1.02);
    }

    .op h4 {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 12px 0 8px;
      color: var(--text-primary);
    }

    .op p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
      min-height: 2.7em;
      margin-bottom: 16px;
    }

    .placeholder {
      height: 200px;
      background: var(--bg-secondary);
      border: 2px dashed var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 3rem;
      margin-bottom: 16px;
    }

    /* Navigation */
    .nav {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 32px;
    }

    /* Code display */
    #codigo-mostrado {
      background: rgba(245, 158, 11, 0.1);
      border: 2px dashed var(--accent);
      border-radius: 14px;
      padding: 20px;
      margin: 20px 0;
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      color: var(--accent);
      letter-spacing: 4px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Footer */
    footer {
      text-align: center;
      color: var(--text-muted);
      margin-top: 60px;
      padding: 40px 20px;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }

      .card {
        padding: 28px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .nav {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    /* Loading spinner */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--text-muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <img src="/img/logo.jpg" alt="Achura Awards" />
      </div>
      <h1>Achura Awards 2026</h1>
      <p class="subtitle">El Lucho de Oro — los premios del año</p>
      <span class="badge">🏆 Votación Abierta</span>
    </header>

    <div class="progress-container">
      <p class="progress-text" id="sub"></p>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <div id="msg" class="msg"></div>

    <div id="paso-email" class="card">
      <h3>🔐 Iniciá sesión</h3>
      <p>Ingresá tu email y te mandamos un código de 6 dígitos. Al verificar tu identidad <strong>no se repiten votaciones</strong>: un email = un voto por categoría.</p>
      <div class="input-group">
        <input id="email" type="email" placeholder="tu@email.com" />
      </div>
      <button class="btn" onclick="enviarCodigo()">Enviar código</button>
      <p id="codigo-mostrado" style="display:none"></p>
      <div class="input-group" style="display:none" id="codigo-input-group">
        <input id="codigo" placeholder="Código de 6 dígitos" maxlength="6" />
      </div>
      <button id="btn-verificar" class="btn" style="display:none" onclick="verificar()">Verificar</button>
    </div>

    <div id="paso-votar" style="display:none"></div>

    <footer>
      <p>Achura Awards · El Lucho de Oro · 2026</p>
    </footer>
  </div>

  <script>
    let token = localStorage.getItem('achura_token');
    let categorias = [];
    let idx = 0;
    let votadas = new Set();

    function msg(t, tipo) {
      const m = document.getElementById('msg');
      m.textContent = t;
      m.className = 'msg ' + tipo;
      setTimeout(() => m.className = 'msg', 5000);
    }

    async function enviarCodigo() {
      const email = document.getElementById('email').value.trim();
      const btn = event.target;
      btn.innerHTML = '<span class="loading"></span>Enviando...';
      btn.disabled = true;

      const r = await fetch('/api/auth/enviar-codigo', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ email }) 
      });
      const d = await r.json();
      
      btn.innerHTML = 'Enviar código';
      btn.disabled = false;

      if (d.success) {
        msg(d.codigo_dev ? 'Código enviado. Te lo mostramos abajo 👇' : 'Código enviado a tu email', 'success');
        document.getElementById('codigo-input-group').style.display = 'block';
        document.getElementById('btn-verificar').style.display = 'inline-block';
        if (d.codigo_dev) {
          const p = document.getElementById('codigo-mostrado');
          p.textContent = `🔑 Tu código es: ${d.codigo_dev}`;
          p.style.display = 'block';
          document.getElementById('codigo').value = d.codigo_dev;
        }
      } else msg(d.error, 'error');
    }

    async function verificar() {
      const email = document.getElementById('email').value.trim();
      const codigo = document.getElementById('codigo').value.trim();
      const btn = event.target;
      btn.innerHTML = '<span class="loading"></span>Verificando...';
      btn.disabled = true;

      const r = await fetch('/api/auth/verificar-codigo', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ email, codigo }) 
      });
      const d = await r.json();
      
      btn.innerHTML = 'Verificar';
      btn.disabled = false;

      if (d.success) {
        token = d.token;
        localStorage.setItem('achura_token', token);
        document.getElementById('paso-email').style.display = 'none';
        await cargarCategorias();
      } else msg(d.error, 'error');
    }

    async function cargarCategorias() {
      const r = await fetch('/api/categorias', { headers: { Authorization: 'Bearer ' + token } });
      const d = await r.json();
      categorias = d.data;
      document.getElementById('paso-votar').style.display = 'block';
      render();
    }

    function render() {
      const cont = document.getElementById('paso-votar');
      const progressFill = document.getElementById('progress-fill');
      
      if (idx >= categorias.length) {
        cont.innerHTML = `
          <div class="card" style="text-align:center">
            <div style="font-size:4rem;margin-bottom:20px">🎉</div>
            <h2>¡Votación completada!</h2>
            <p>Gracias por participar en las Achura Awards 2026.</p>
            <div class="badge" style="margin-top:20px">Votaste en ${categorias.length} categorías</div>
          </div>`;
        document.getElementById('sub').textContent = '';
        progressFill.style.width = '100%';
        return;
      }

      const c = categorias[idx];
      const progress = ((idx) / categorias.length) * 100;
      document.getElementById('sub').textContent = `Categoría ${idx + 1} de ${categorias.length}`;
      progressFill.style.width = progress + '%';

      let ops = c.opciones.map((o) => `
        <div class="op">
          ${o.video_url ? `<video controls preload="none" src="${o.video_url}"></video>` : o.imagen_url ? `<img src="${o.imagen_url}" alt="${o.nombre}" />` : '<div class="placeholder">📷</div>'}
          <h4>${o.nombre}</h4>
          <p>${o.descripcion || ''}</p>
          ${votadas.has(c.id) ? '' : `<button class="btn" onclick="votar('${c.id}','${o.id}','${o.nombre}')">Votar</button>`}
        </div>`).join('');

      cont.innerHTML = `
        <div class="card">
          <h2>${c.nombre}</h2>
          <p>${c.descripcion || ''}</p>
          <div class="grid">${ops}</div>
          <div class="nav">
            <button class="btn btn-secondary" ${idx === 0 ? 'disabled' : ''} onclick="idx--;render()">← Anterior</button>
            <button class="btn btn-secondary" onclick="idx++;render()">Siguiente →</button>
          </div>
        </div>`;
    }

    async function votar(categoriaId, opcionId, nombre) {
      const r = await fetch('/api/votar', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, 
        body: JSON.stringify({ categoria_id: categoriaId, opcion_id: opcionId }) 
      });
      const d = await r.json();
      if (d.success) {
        votadas.add(categoriaId);
        msg(`✓ Voto registrado: ${nombre}`, 'success');
        idx++;
        render();
      } else msg(d.error, 'error');
    }

    if (token) { 
      document.getElementById('paso-email').style.display = 'none'; 
      cargarCategorias(); 
    }
  </script>
</body>
</html>
