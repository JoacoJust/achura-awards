<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Achura Awards 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
  :root {
    --bg: #070d1a; --panel: #101a30; --panel2: #15213d;
    --border: #233456; --border2: #2e4470;
    --text: #f2f5fb; --muted: #94a3c0;
    --accent: #10b981; --accent-h: #34d399;
  }
  body {
    background: radial-gradient(circle at 50% -10%, #1b2c52 0%, #070d1a 55%);
    color: var(--text); min-height: 100vh; padding: 32px 16px 60px; -webkit-font-smoothing: antialiased;
  }
  header { text-align: center; margin-bottom: 8px; }
  header img { width: 96px; height: 96px; object-fit: cover; border-radius: 20px; border: 1px solid var(--border2); }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: 3px; margin-top: 16px; text-transform: uppercase; }
  header p.ternas { font-size: 1.4rem; letter-spacing: 6px; color: var(--muted); text-transform: uppercase; margin-top: 4px; font-weight: 600; }
  .sub { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: .9rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin: 16px auto; max-width: 820px; }
  .card h2 { font-weight: 700; margin-bottom: 8px; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 3px; text-align: center; }
  .card h2::before, .card h2::after { content: "🌿"; margin: 0 10px; font-size: 1rem; }
  .card h3 { font-weight: 700; margin-bottom: 8px; font-size: 1.1rem; }
  .card p { color: var(--muted); font-size: .9rem; line-height: 1.5; }
  input { width: 100%; padding: 12px 14px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--border2); background: var(--panel2); color: var(--text); font-size: .95rem; transition: border-color .15s; }
  input:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #04120c; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; margin: 6px 4px; font-size: .95rem; transition: background .15s, transform .1s; }
  button:hover { background: var(--accent-h); transform: translateY(-1px); }
  button.sec { background: var(--panel2); color: var(--text); border: 1px solid var(--border2); }
  button.sec:hover { border-color: var(--accent); }
  button:disabled { background: #1e1e1e; color: #555; cursor: not-allowed; transform: none; }
  .msg { margin: 12px auto; max-width: 820px; padding: 14px 16px; border-radius: 10px; display: none; font-size: .9rem; border: 1px solid; }
  .ok { background: #062e1f; color: #6ee7b7; display: block; border-color: #0f5132; }
  .err { background: #2e0d11; color: #f87171; display: block; border-color: #5b1a22; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 18px; }
  .op { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; transition: border-color .15s, transform .15s; }
  .op:hover { border-color: var(--accent); transform: translateY(-3px); }
  .op img, .op video { width: 100%; border-radius: 8px; display: block; }
  .op h4 { margin: 10px 0 4px; font-size: 1rem; font-weight: 600; }
  .op p { color: var(--muted); font-size: .82rem; min-height: 1.2em; }
  .barra { height: 8px; background: var(--panel2); border-radius: 6px; margin: 14px 0; overflow: hidden; border: 1px solid var(--border); }
  .barra div { height: 100%; background: var(--accent); transition: width .5s; }
  .progreso { color: var(--muted); text-align: center; margin-top: 6px; font-size: .85rem; }
  .nav { text-align: center; margin-top: 18px; }
  .placeholder { height: 120px; background: var(--panel2); border: 1px dashed var(--border2); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.6rem; }
  footer { text-align: center; color: #555; margin-top: 30px; font-size: .8rem; }
</style>
</head>
<body>
  <header>
    <img src="/img/logo.jpg" alt="Achura Awards" />
    <h1>ACHURA AWARDS 2026</h1>
    <p class="ternas">Ternas</p>
    <p class="sub">El Lucho de Oro — los premios del año</p>
  </header>

  <p class="progreso" id="sub"></p>
  <div id="msg" class="msg"></div>

  <div id="paso-email" class="card">
    <h3>Iniciá sesión</h3>
    <p>Ingresá tu email y te mandamos un código de 6 dígitos. Al verificar tu identidad <b>no se repiten votaciones</b>: un email = un voto por categoría.</p>
    <input id="email" type="email" placeholder="tu@email.com" />
    <button onclick="enviarCodigo()">Enviar código</button>
    <p id="codigo-mostrado" style="display:none"></p>
    <input id="codigo" placeholder="Código de 6 dígitos" style="display:none" />
    <button id="btn-verificar" style="display:none" onclick="verificar()">Verificar</button>
  </div>

  <div id="paso-votar" style="display:none"></div>

  <footer>Achura Awards · El Lucho de Oro</footer>

<script>
let token = localStorage.getItem('achura_token');
let categorias = [];
let idx = 0;
let votadas = new Set();

function msg(t, tipo) { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg ' + tipo; setTimeout(() => m.className = 'msg', 5000); }

async function enviarCodigo() {
  const email = document.getElementById('email').value.trim();
  const r = await fetch('/api/auth/enviar-codigo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
  const d = await r.json();
  if (d.success) {
    msg(d.codigo_dev ? 'Código enviado. Te lo mostramos abajo 👇' : 'Código enviado a tu email', 'ok');
    document.getElementById('codigo').style.display = 'block';
    document.getElementById('btn-verificar').style.display = 'inline-block';
    if (d.codigo_dev) {
      const p = document.getElementById('codigo-mostrado');
      p.textContent = `🔑 Tu código es: ${d.codigo_dev} (modo dev, no se borra)`;
      p.style.display = 'block';
      p.style.cssText = 'display:block;margin:10px 0;padding:12px;border:1px dashed var(--accent);border-radius:10px;font-size:1.3rem;font-weight:700;text-align:center;color:var(--accent)';
      document.getElementById('codigo').value = d.codigo_dev;
    }
  } else msg(d.error, 'err');
}

async function verificar() {
  const email = document.getElementById('email').value.trim();
  const codigo = document.getElementById('codigo').value.trim();
  const r = await fetch('/api/auth/verificar-codigo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, codigo }) });
  const d = await r.json();
  if (d.success) {
    token = d.token;
    localStorage.setItem('achura_token', token);
    document.getElementById('paso-email').style.display = 'none';
    await cargarCategorias();
  } else msg(d.error, 'err');
}

async function cargarCategorias() {
  const r = await fetch('/api/categorias', { headers: { Authorization: 'Bearer ' + token } });
  const d = await r.json();
  categorias = d.data;
  document.getElementById('paso-votar').style.display = 'block';
  render();
}

function render() {
  const cont = document.getElementById('paso-votar');
  if (idx >= categorias.length) {
    cont.innerHTML = `<div class="card" style="text-align:center"><h2>¡Votación completada! 🎉</h2><p>Gracias por participar en las Achura Awards.</p></div>`;
    document.getElementById('sub').textContent = '';
    return;
  }
  const c = categorias[idx];
  document.getElementById('sub').textContent = `Categoría ${idx + 1} de ${categorias.length}`;
  let ops = c.opciones.map((o) => `
    <div class="op">
      ${o.video_url ? `<video controls preload="none" src="${o.video_url}"></video>` : o.imagen_url ? `<img src="${o.imagen_url}" />` : '<div class="placeholder">📷</div>'}
      <h4>${o.nombre}</h4>
      <p>${o.descripcion || ''}</p>
      ${votadas.has(c.id) ? '' : `<button onclick="votar('${c.id}','${o.id}','${o.nombre}')">Votar</button>`}
    </div>`).join('');
  cont.innerHTML = `
    <div class="card">
      <div class="barra"><div style="width:${(idx / categorias.length) * 100}%"></div></div>
      <h2>${c.nombre}</h2>
      <p>${c.descripcion || ''}</p>
      <div class="grid">${ops}</div>
      <div class="nav">
        <button class="sec" ${idx === 0 ? 'disabled' : ''} onclick="idx--;render()">← Anterior</button>
        <button class="sec" onclick="idx++;render()">Siguiente →</button>
      </div>
    </div>`;
}

async function votar(categoriaId, opcionId, nombre) {
  const r = await fetch('/api/votar', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ categoria_id: categoriaId, opcion_id: opcionId }) });
  const d = await r.json();
  if (d.success) {
    votadas.add(categoriaId);
    msg(`Voto registrado: ${nombre}`, 'ok');
    idx++;
    render();
  } else msg(d.error, 'err');
}

if (token) { document.getElementById('paso-email').style.display = 'none'; cargarCategorias(); }
</script>
</body>
</html>
