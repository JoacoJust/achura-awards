<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achura Awards 2026 — Ternas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-card: #111111;
      --bg-card-hover: #1a1a1a;
      --border: #333333;
      --border-light: #444444;
      --border-gold: #d4af37;
      --text-primary: #ffffff;
      --text-secondary: #cccccc;
      --text-muted: #888888;
      --gold: #d4af37;
      --gold-light: #f4cf57;
      --gold-dark: #b8960f;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f4cf57 50%, #d4af37 100%);
      --white: #ffffff;
      --shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 8px 50px rgba(0, 0, 0, 0.6);
      --shadow-gold: 0 4px 30px rgba(212, 175, 55, 0.2);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle texture overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(45deg, rgba(255,255,255,0.01) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.01) 50%, rgba(255,255,255,0.01) 75%, transparent 75%, transparent);
      background-size: 100px 100px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      padding: 80px 20px 60px;
      position: relative;
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
    }

    .logo-glow {
      position: absolute;
      inset: -20px;
      background: var(--gold-gradient);
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.3;
      z-index: -1;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.1); }
    }

    header img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--gold);
      box-shadow: var(--shadow-gold);
      position: relative;
      z-index: 1;
      transition: transform 0.4s ease;
    }

    header img:hover {
      transform: scale(1.05) rotate(5deg);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -2px;
      margin: 32px 0 16px;
      color: var(--white);
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.3);
    }

    .subtitle {
      font-size: 1.5rem;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* Progress */
    .progress-container {
      max-width: 600px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }

    .progress-text {
      text-align: center;
      color: var(--gold);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 4px;
      background: var(--bg-secondary);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: var(--gold-gradient);
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      margin: 0 auto 40px;
      max-width: 700px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--gold-gradient);
      opacity: 0.5;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-gold);
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--white);
      text-align: center;
    }

    .card h3 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-primary);
      text-align: center;
    }

    .card p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.8;
      margin-bottom: 24px;
      text-align: center;
    }

    .card strong {
      color: var(--gold);
      font-weight: 600;
    }

    /* Input */
    .input-group {
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 18px 24px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all 0.3s ease;
      outline: none;
      text-align: center;
      letter-spacing: 1px;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
    }

    input::placeholder {
      color: var(--text-muted);
      letter-spacing: 0;
    }

    /* Button */
    .btn {
      background: var(--gold-gradient);
      color: var(--bg-primary);
      border: none;
      padding: 18px 40px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-gold);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 40px rgba(212, 175, 55, 0.4);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 2px solid var(--border);
      box-shadow: none;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-secondary:hover {
      border-color: var(--gold);
      box-shadow: 0 4px 30px rgba(212, 175, 55, 0.2);
    }

    .btn:disabled {
      background: var(--bg-secondary);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn:disabled::before {
      display: none;
    }

    /* Message */
    .msg {
      margin: 24px auto;
      max-width: 600px;
      padding: 24px 32px;
      border-radius: 16px;
      display: none;
      font-size: 1rem;
      font-weight: 500;
      border: 1px solid;
      text-align: center;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.success {
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      border-color: var(--gold);
      display: block;
    }

    .msg.error {
      background: rgba(255, 0, 0, 0.1);
      color: #ff6b6b;
      border-color: #ff4444;
      display: block;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
      margin-top: 40px;
    }

    /* Option Card */
    .op {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 0;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .op::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gold-gradient);
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }

    .op:hover {
      border-color: var(--gold);
      transform: translateY(-12px);
      box-shadow: var(--shadow-lg);
    }

    .op:hover::before {
      transform: scaleX(1);
    }

    .op-media {
      position: relative;
      width: 100%;
      height: 240px;
      overflow: hidden;
    }

    .op img, .op video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .op:hover img, .op:hover video {
      transform: scale(1.05);
    }

    .op-content {
      padding: 28px 24px 32px;
    }

    .op h4 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      margin: 16px 0 12px;
      color: var(--white);
      letter-spacing: 0.5px;
    }

    .op p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 3em;
      margin-bottom: 24px;
    }

    .placeholder {
      height: 240px;
      background: var(--bg-secondary);
      border: 2px dashed var(--border);
      border-radius: 20px 20px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 4rem;
    }

    /* Scissor Icon */
    .scissor-icon {
      font-size: 2rem;
      margin-bottom: 16px;
      display: block;
    }

    /* Navigation */
    .nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    /* Code display */
    #codigo-mostrado {
      background: rgba(212, 175, 55, 0.1);
      border: 2px dashed var(--gold);
      border-radius: 16px;
      padding: 28px;
      margin: 24px 0;
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      color: var(--gold);
      letter-spacing: 8px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Footer */
    footer {
      text-align: center;
      color: var(--text-muted);
      margin-top: 80px;
      padding: 60px 20px;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      letter-spacing: 1px;
    }

    .footer h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--gold);
      margin-bottom: 12px;
    }

    /* Category Badge */
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 12px 24px;
      border-radius: 50px;
      margin-bottom: 32px;
    }

    .category-badge .scissor {
      font-size: 1.5rem;
    }

    .category-badge span {
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .card {
        padding: 32px 24px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .nav {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    /* Loading spinner */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--text-muted);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Completion Screen */
    .completion {
      text-align: center;
      padding: 60px 40px;
    }

    .completion .icon {
      font-size: 6rem;
      margin-bottom: 24px;
      animation: bounce 1s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .completion h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .completion p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      margin-bottom: 24px;
    }

    .completion .stats {
      display: inline-block;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 16px 32px;
      border-radius: 50px;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-glow"></div>
        <img src="/img/logo.jpg" alt="Achura Awards" />
      </div>
      <h1>Achura Awards</h1>
      <p class="subtitle">Ternas 2026</p>
      <p class="tagline">Los premios más picantes del año</p>
    </header>

    <div class="progress-container">
      <p class="progress-text" id="sub"></p>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <div id="msg" class="msg"></div>

    <div id="paso-email" class="card">
      <h3>🔐 Iniciar Sesión</h3>
      <p>Ingresa tu email para recibir un código de verificación. Un email = un voto por categoría. <strong>Sin repetición de votos.</strong></p>
      <div class="input-group">
        <input id="email" type="email" placeholder="tu@email.com" />
      </div>
      <button class="btn" onclick="enviarCodigo()">Enviar Código</button>
      <p id="codigo-mostrado" style="display:none"></p>
      <div class="input-group" style="display:none" id="codigo-input-group">
        <input id="codigo" placeholder="Código de 6 dígitos" maxlength="6" />
      </div>
      <button id="btn-verificar" class="btn" style="display:none" onclick="verificar()">Verificar</button>
    </div>

    <div id="paso-votar" style="display:none"></div>

    <footer>
      <h2>Achura Awards</h2>
      <p>El Lucho de Oro · 2026</p>
    </footer>
  </div>

  <script>
    let token = localStorage.getItem('achura_token');
    let categorias = [];
    let idx = 0;
    let votadas = new Set();

    function msg(t, tipo) {
      const m = document.getElementById('msg');
      m.textContent = t;
      m.className = 'msg ' + tipo;
      setTimeout(() => m.className = 'msg', 5000);
    }

    async function enviarCodigo() {
      const email = document.getElementById('email').value.trim();
      const btn = event.target;
      btn.innerHTML = '<span class="loading"></span>Enviando...';
      btn.disabled = true;

      const r = await fetch('/api/auth/enviar-codigo', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ email }) 
      });
      const d = await r.json();
      
      btn.innerHTML = 'Enviar Código';
      btn.disabled = false;

      if (d.success) {
        msg(d.codigo_dev ? 'Código enviado. Te lo mostramos abajo 👇' : 'Código enviado a tu email', 'success');
        document.getElementById('codigo-input-group').style.display = 'block';
        document.getElementById('btn-verificar').style.display = 'inline-block';
        if (d.codigo_dev) {
          const p = document.getElementById('codigo-mostrado');
          p.textContent = `🔑 ${d.codigo_dev}`;
          p.style.display = 'block';
          document.getElementById('codigo').value = d.codigo_dev;
        }
      } else msg(d.error, 'error');
    }

    async function verificar() {
      const email = document.getElementById('email').value.trim();
      const codigo = document.getElementById('codigo').value.trim();
      const btn = event.target;
      btn.innerHTML = '<span class="loading"></span>Verificando...';
      btn.disabled = true;

      const r = await fetch('/api/auth/verificar-codigo', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ email, codigo }) 
      });
      const d = await r.json();
      
      btn.innerHTML = 'Verificar';
      btn.disabled = false;

      if (d.success) {
        token = d.token;
        localStorage.setItem('achura_token', token);
        document.getElementById('paso-email').style.display = 'none';
        await cargarCategorias();
      } else msg(d.error, 'error');
    }

    async function cargarCategorias() {
      const r = await fetch('/api/categorias', { headers: { Authorization: 'Bearer ' + token } });
      const d = await r.json();
      categorias = d.data;
      document.getElementById('paso-votar').style.display = 'block';
      render();
    }

    function render() {
      const cont = document.getElementById('paso-votar');
      const progressFill = document.getElementById('progress-fill');
      
      if (idx >= categorias.length) {
        cont.innerHTML = `
          <div class="card completion">
            <div class="icon">�</div>
            <h2>¡Votación Completada!</h2>
            <p>Gracias por participar en las Achura Awards 2026</p>
            <div class="stats">Votaste en ${categorias.length} categorías</div>
          </div>`;
        document.getElementById('sub').textContent = '';
        progressFill.style.width = '100%';
        return;
      }

      const c = categorias[idx];
      const progress = ((idx) / categorias.length) * 100;
      document.getElementById('sub').textContent = `Categoría ${idx + 1} de ${categorias.length}`;
      progressFill.style.width = progress + '%';

      let ops = c.opciones.map((o) => `
        <div class="op">
          <div class="op-media">
            ${o.video_url ? `<video controls preload="none" src="${o.video_url}"></video>` : o.imagen_url ? `<img src="${o.imagen_url}" alt="${o.nombre}" />` : '<div class="placeholder">📷</div>'}
          </div>
          <div class="op-content">
            <span class="scissor-icon">✂️</span>
            <h4>${o.nombre}</h4>
            <p>${o.descripcion || ''}</p>
            ${votadas.has(c.id) ? '<button class="btn" disabled>Ya votado</button>' : `<button class="btn" onclick="votar('${c.id}','${o.id}','${o.nombre}')">Votar</button>`}
          </div>
        </div>`).join('');

      cont.innerHTML = `
        <div class="card">
          <div class="category-badge">
            <span class="scissor">✂️</span>
            <span>Terna ${idx + 1}</span>
          </div>
          <h2>${c.nombre}</h2>
          <p>${c.descripcion || ''}</p>
          <div class="grid">${ops}</div>
          <div class="nav">
            <button class="btn btn-secondary" ${idx === 0 ? 'disabled' : ''} onclick="idx--;render()">← Anterior</button>
            <button class="btn btn-secondary" onclick="idx++;render()">Siguiente →</button>
          </div>
        </div>`;
    }

    async function votar(categoriaId, opcionId, nombre) {
      const r = await fetch('/api/votar', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, 
        body: JSON.stringify({ categoria_id: categoriaId, opcion_id: opcionId }) 
      });
      const d = await r.json();
      if (d.success) {
        votadas.add(categoriaId);
        msg(`✓ Voto registrado: ${nombre}`, 'success');
        idx++;
        render();
      } else msg(d.error, 'error');
    }

    if (token) { 
      document.getElementById('paso-email').style.display = 'none'; 
      cargarCategorias(); 
    }
  </script>
</body>
</html>
