<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Achura Awards — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #070d1a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .card { background: #111; border: 1px solid #333; border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; }
  input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; font-size: 1rem; }
  input { background: #161616; color: #fff; }
  button { background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; }
  .err { color: #f87171; }
  .verpwd { position: relative; }
  .verpwd button { position: absolute; right: 6px; top: 6px; width: auto; padding: 8px 12px; background: #333; color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <h2>🔐 Iniciar sesión</h2>
    <input id="email" type="email" placeholder="Email" />
    <div class="verpwd">
      <input id="password" type="password" placeholder="Contraseña" />
      <button type="button" id="toggle">👁️</button>
    </div>
    <button id="entrar">Entrar</button>
    <p id="err" class="err"></p>
  </div>
<script>
document.getElementById('toggle').onclick = () => {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
};
document.getElementById('entrar').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
  const d = await r.json();
  if (d.ok) location.href = '/AchuraAwards';
  else document.getElementById('err').textContent = d.error || 'Error';
};
</script>
</body>
</html>
