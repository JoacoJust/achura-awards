<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achura Awards — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-card: #111111;
      --bg-card-hover: #1a1a1a;
      --border: #333333;
      --border-light: #444444;
      --border-gold: #d4af37;
      --text-primary: #ffffff;
      --text-secondary: #cccccc;
      --text-muted: #888888;
      --gold: #d4af37;
      --gold-light: #f4cf57;
      --gold-dark: #b8960f;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f4cf57 50%, #d4af37 100%);
      --white: #ffffff;
      --shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 8px 50px rgba(0, 0, 0, 0.6);
      --shadow-gold: 0 4px 30px rgba(212, 175, 55, 0.2);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 60px 24px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(45deg, rgba(255,255,255,0.01) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.01) 50%, rgba(255,255,255,0.01) 75%, transparent 75%, transparent);
      background-size: 100px 100px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 60px;
      position: relative;
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }

    .logo-glow {
      position: absolute;
      inset: -15px;
      background: var(--gold-gradient);
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.3;
      z-index: -1;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.1); }
    }

    header img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--gold);
      box-shadow: var(--shadow-gold);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -1px;
      margin: 24px 0 12px;
      color: var(--white);
      text-transform: uppercase;
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.3);
    }

    .badge {
      display: inline-block;
      background: var(--gold-gradient);
      color: var(--bg-primary);
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: var(--shadow-gold);
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--gold-gradient);
      opacity: 0.5;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-gold);
    }

    .card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--white);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Login Card */
    #login {
      max-width: 480px;
      margin: 60px auto;
    }

    .input-group {
      margin-bottom: 24px;
    }

    input, select {
      width: 100%;
      padding: 16px 24px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all 0.3s ease;
      outline: none;
      text-align: center;
      letter-spacing: 1px;
    }

    input:focus, select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
    }

    /* Button */
    .btn {
      background: var(--gold-gradient);
      color: var(--bg-primary);
      border: none;
      padding: 16px 36px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-gold);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 40px rgba(212, 175, 55, 0.4);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 2px solid var(--border);
      box-shadow: none;
      padding: 12px 24px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-secondary:hover {
      border-color: var(--gold);
      box-shadow: 0 4px 30px rgba(212, 175, 55, 0.2);
    }

    .btn-small {
      padding: 10px 20px;
      font-size: 0.85rem;
    }

    /* Metrics */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gold-gradient);
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }

    .metric-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-gold);
    }

    .metric-card:hover::before {
      transform: scaleX(1);
    }

    .metric-card .value {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .metric-card .label {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Results */
    .result-item {
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .result-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .result-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .result-votes {
      color: var(--gold);
      font-size: 1rem;
      font-weight: 600;
    }

    .option-row {
      margin: 16px 0;
    }

    .option-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .option-name {
      color: var(--text-primary);
      font-weight: 500;
    }

    .option-stats {
      color: var(--gold);
      font-weight: 700;
    }

    .progress-bar {
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: var(--gold-gradient);
      border-radius: 8px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Table */
    .table-container {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    th {
      background: var(--bg-secondary);
      color: var(--gold);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
    }

    tr:hover td {
      background: var(--bg-card-hover);
    }

    /* Form Group */
    .form-row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .form-row input, .form-row select {
      flex: 1;
      min-width: 160px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    /* Category List */
    .category-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-radius: 12px;
      background: var(--bg-secondary);
      margin-bottom: 12px;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .category-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-gold);
    }

    .category-name {
      flex: 1;
      font-weight: 600;
      color: var(--white);
    }

    .category-id {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Error */
    #lerr {
      color: #ff6b6b;
      margin-top: 16px;
      font-size: 0.95rem;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .form-row {
        flex-direction: column;
      }

      .form-row input, .form-row select {
        width: 100%;
      }
    }

    /* Footer */
    footer {
      text-align: center;
      color: var(--text-muted);
      margin-top: 80px;
      padding: 60px 20px;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      letter-spacing: 1px;
    }

    footer h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--gold);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-glow"></div>
        <img src="/img/logo.jpg" alt="Achura Awards" />
      </div>
      <h1>Admin Panel</h1>
      <span class="badge">✂️ Panel de Administración</span>
    </header>

    <div id="login" class="card">
      <h3>🔐 Iniciar Sesión</h3>
      <div class="input-group">
        <input id="aemail" placeholder="Email admin" />
      </div>
      <div class="input-group">
        <input id="apass" type="password" placeholder="Contraseña" />
      </div>
      <button class="btn" style="width:100%" onclick="hacerLogin()">Ingresar</button>
      <p id="lerr"></p>
    </div>

    <div id="panel" style="display:none">
      <div class="metrics" id="metricas"></div>

      <div class="card">
        <h3>📊 Resultados en Vivo</h3>
        <div id="resultados"></div>
        <div style="margin-top:24px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
          <button class="btn" onclick="descargar()">📥 Descargar CSV</button>
          <button class="btn btn-secondary" onclick="cargarTodo()">🔄 Refrescar</button>
        </div>
      </div>

      <div class="card">
        <h3>👥 Votantes</h3>
        <div class="table-container">
          <table id="votantes"></table>
        </div>
      </div>

      <div class="card">
        <h3>📝 Gestión de Categorías</h3>
        <div class="form-row">
          <input id="cn" placeholder="Nombre categoría" />
          <input id="cd" placeholder="Descripción" />
          <input id="cp" type="number" placeholder="Posición" />
        </div>
        <button class="btn btn-small" onclick="crearCategoria()">+ Nueva Categoría</button>
        <div class="divider"></div>
        <div class="form-row">
          <input id="oid" placeholder="ID categoría" />
          <input id="on" placeholder="Nombre opción" />
          <input id="op2" type="number" placeholder="Posición" />
        </div>
        <button class="btn btn-small" onclick="crearOpcion()">+ Nueva Opción</button>
        <div class="divider"></div>
        <div id="lista-cats"></div>
        <div class="divider"></div>
        <h3>📤 Subir Media a Opción</h3>
        <div class="form-row">
          <input id="up-oid" placeholder="ID opción" />
          <select id="up-tipo">
            <option value="imagen">Imagen</option>
            <option value="video">Video</option>
          </select>
          <input id="up-file" type="file" />
        </div>
        <button class="btn btn-small" onclick="subirMedia()">Subir</button>
      </div>
    </div>

    <footer>
      <h2>Achura Awards</h2>
      <p>El Lucho de Oro · 2026</p>
    </footer>
  </div>

  <script>
    let token = localStorage.getItem('achura_admin_token');
    const H = () => ({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' });
    const el = (id) => document.getElementById(id);

    async function hacerLogin() {
      const r = await fetch('/api/admin/login', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ email: el('aemail').value, password: el('apass').value }) 
      });
      const d = await r.json();
      if (d.success) { 
        token = d.token; 
        localStorage.setItem('achura_admin_token', token); 
        mostrarPanel(); 
      } else el('lerr').textContent = d.error;
    }

    function mostrarPanel() { 
      el('login').style.display = 'none'; 
      el('panel').style.display = 'block'; 
      cargarTodo(); 
    }

    async function cargarTodo() {
      const d = await (await fetch('/api/admin/dashboard', { headers: H() })).json();
      el('metricas').innerHTML = `
        <div class="metric-card">
          <div class="value">${d.data.total_votos}</div>
          <div class="label">Total Votos</div>
        </div>
        <div class="metric-card">
          <div class="value">${d.data.total_votantes}</div>
          <div class="label">Votantes</div>
        </div>
        <div class="metric-card">
          <div class="value">${d.data.categorias_activas}</div>
          <div class="label">Categorías</div>
        </div>`;

      const r = await (await fetch('/api/admin/resultados', { headers: H() })).json();
      el('resultados').innerHTML = r.data.map(c => `
        <div class="result-item">
          <div class="result-header">
            <span class="result-title">${c.categoria_nombre}</span>
            <span class="result-votes">${c.total_votos} votos ${c.activa ? '' : '<span style="color:var(--text-muted)">(inactiva)</span>'}</span>
          </div>
          ${c.opciones.map(o => `
            <div class="option-row">
              <div class="option-header">
                <span class="option-name">${o.nombre}</span>
                <span class="option-stats">${o.votos} (${o.porcentaje}%)</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width:${o.porcentaje}%"></div>
              </div>
            </div>`).join('')}
        </div>`).join('');

      const v = await (await fetch('/api/admin/votantes?page=1&limit=50', { headers: H() })).json();
      el('votantes').innerHTML = '<tr><th>Email</th><th>Verificado</th><th>IP</th><th>Votos</th></tr>' +
        v.data.map(u => `<tr><td>${u.email}</td><td>${u.fecha_verificacion ? new Date(u.fecha_verificacion).toLocaleString() : '-'}</td><td>${u.ip_address || '-'}</td><td>${u.total_votos}</td></tr>`).join('');

      el('lista-cats').innerHTML = r.data.map(c => `
        <div class="category-item">
          <span class="category-name"><b>${c.categoria_nombre}</b></span>
          <span class="category-id">#${c.categoria_id}</span>
          <button class="btn btn-secondary btn-small" onclick="toggleCat('${c.categoria_id}', ${!c.activa})">${c.activa ? 'Desactivar' : 'Activar'}</button>
        </div>`).join('');
    }

    async function crearCategoria() {
      const r = await fetch('/api/admin/categorias', { 
        method: 'POST', 
        headers: H(), 
        body: JSON.stringify({ 
          nombre: el('cn').value, 
          descripcion: el('cd').value, 
          posicion: Number(el('cp').value) 
        }) 
      });
      const d = await r.json(); 
      alert(d.success ? '✓ Categoría creada' : d.error); 
      cargarTodo();
    }

    async function crearOpcion() {
      const r = await fetch('/api/admin/opciones', { 
        method: 'POST', 
        headers: H(), 
        body: JSON.stringify({ 
          categoria_id: el('oid').value, 
          nombre: el('on').value, 
          posicion: Number(el('op2').value) 
        }) 
      });
      const d = await r.json(); 
      alert(d.success ? '✓ Opción creada' : d.error); 
      cargarTodo();
    }

    async function toggleCat(id, activa) {
      await fetch(`/api/admin/categorias/${id}/toggle`, { 
        method: 'PUT', 
        headers: H(), 
        body: JSON.stringify({ activa }) 
      }); 
      cargarTodo();
    }

    async function subirMedia() {
      const fd = new FormData();
      fd.append('file', el('up-file').files[0]);
      fd.append('opcion_id', el('up-oid').value);
      fd.append('tipo', el('up-tipo').value);
      const r = await fetch('/api/admin/upload-media', { 
        method: 'POST', 
        headers: { Authorization: 'Bearer ' + token }, 
        body: fd 
      });
      const d = await r.json(); 
      alert(d.success ? '✓ Subido: ' + d.data.url : d.error);
    }

    async function descargar() {
      const r = await fetch('/api/admin/reporte', { headers: { Authorization: 'Bearer ' + token } });
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'achura_reporte.csv';
      a.click();
    }

    if (token) mostrarPanel();
  </script>
</body>
</html>
